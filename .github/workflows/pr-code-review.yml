name: PR Code Review (agent)

# Automatic code review on PRs into main, run entirely on local DGX
# inference — no Anthropic API, no secret required. Review logic lives as
# a composite action in rdcahalane/ai-skills (one source of truth for
# every personal repo that calls it) — NOT a reusable workflow: GitHub
# doesn't honor a reusable workflow's runs-on across repo boundaries for
# self-hosted runners (github.com/orgs/community/discussions/25783), so
# runs-on has to be declared here, in the caller, per repo.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: pr-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, dgx]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rdcahalane/ai-skills/.github/actions/code-review@main
